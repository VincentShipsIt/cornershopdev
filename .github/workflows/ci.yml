name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cornershopdev_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cornershopdev_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Real Postgres for unit + opt-in integration suites. Prisma generate only
      # needs the URL shape; migrate + postgres tests exercise the service.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/cornershopdev_ci
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-32-bytes
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx --bun prisma migrate deploy
      - run: bun run test
      # Own process: bun mock.module("@/lib/db") is process-global, so the
      # publication suite cannot share the unit-test run.
      - name: Postgres publication suite
        env:
          SITE_PUBLICATION_POSTGRES_TEST: "1"
        run: bun test src/lib/site-publication.postgres.test.ts
      - run: bun run lint
      - run: bun run design:lint
      - run: bun run build
      - name: Cold-cache brand font contract
        run: bun run verify:brand-fonts
      # These static-route audits do not exercise workflows. Keep the server on
      # the local world instead of inheriting the job's Postgres test backend.
      - name: Lighthouse budgets
        env:
          WORKFLOW_TARGET_WORLD: "local"
        run: bun run lighthouse
      - name: Show Lighthouse server log
        if: failure()
        run: cat .next/lighthouse-server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouseci
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
      - run: shellcheck deploy/aws/*.sh
      - run: bash deploy/aws/test-host-launcher.sh

  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cornershopdev_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cornershopdev_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build production candidate image
        run: docker build --tag cornershopdev:runtime-contract .
      - name: Verify production container runtime
        run: bash deploy/aws/test-container-runtime.sh cornershopdev:runtime-contract

  deploy:
    # Ships on a manual dispatch or when a stable GitHub release is published.
    # Release events check out the release tag, so cutting a release deploys that
    # exact commit. Prereleases (RC/beta) are excluded so only stable releases reach
    # production. The verify gate and the Production environment protection still apply.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false)
    needs: [verify, container-runtime]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-production.yml
